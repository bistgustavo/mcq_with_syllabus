services:
  mysql:
    image: mysql:8.0
    container_name: mcq_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mcq_platform
      MYSQL_USER: mcq_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u mcq_user -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local fallbacks for Qdrant/Redis (used automatically when the cloud ones are unreachable).
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mcq_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: mcq_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Local LLM. No host port is published, so it does not clash with an Ollama
  # already running on the host. Pull the model once:
  #   docker exec -it mcq_ollama ollama pull mistral:7b
  ollama:
    image: ollama/ollama:latest
    container_name: mcq_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    container_name: mcq_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173
      QDRANT_LOCAL_URL: http://qdrant:6333
      REDIS_LOCAL_URL: redis://redis:6379/0
    user: root
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  celery_worker:
    build:
      context: ./backend
    container_name: mcq_celery_worker
    restart: unless-stopped
    user: root
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/uploads
      QDRANT_LOCAL_URL: http://qdrant:6333
      REDIS_LOCAL_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mcq_frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
  ollama_data:
  qdrant_data:
  redis_data:
  hf_cache:
